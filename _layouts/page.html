---
layout: default
---
<!-- Here, the post css style is used to avoid repeating -->
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.description }}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
