title: Leonardo Salicari
description: >-
baseurl: "" # subpath, e.g. "" if using a user/org page (username.github.io)
url: "https://loscati.github.io" # base hostname & protocol, no trailing slash

author: Leonardo Salicari
email: 
github_username: loscati

# Plugins allowed by GitHub Pages (github-pages gem pins versions for you)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# All standalone pages (home, posts index, photos hub, photo albums,
# ...) live in _pages/ as a collection, output as real pages. Each
# page sets its own `permalink` in front matter, so the pattern below
# is only a fallback for any page that doesn't specify one. Loop over
# them in templates via `site.collections.pages.docs`.
collections:
  pages:
    output: true
    permalink: /:path/

# Nav bar links, edit as needed. Kept deliberately short: Photos and
# individual notebook-bearing posts are reachable by linking to them
# from other pages, not from the top nav.
nav_links:
  - title: blog
    url: /posts/
  - title: cv
    url: /cv/
  - title: teaching
    url: /teaching/
  - title: 📋
    url: /resources/

markdown: kramdown
permalink: /:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .devcontainer
  - assets/notebooks_src
  - scripts
  - .venv
  - _drafts
  - .gitignore
  - AGENTS.md
